<title>Tierra y Fuego · Pizza artesanal · Lago de Atitlán</title>
<meta name="description" content="Tierra y Fuego: pizza artesanal horneada al fuego, a domicilio y para llevar. Lago de Atitlán, Guatemala. De la familia de De la Tierra.">
<meta name="theme-color" content="#16110e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2316110e'/><path d='M10 85 L42 35 L58 35 L90 85Z' fill='%23e8a15a'/></svg>">

<style>
  :root { --coal:#16110e; --cream:#f1e7d6; --ember:#e8a15a; --muted:#a39683; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; }
  body {
    background: radial-gradient(ellipse 80% 50% at 50% 105%, rgba(181,83,42,.30), transparent 70%), var(--coal);
    color:var(--cream); font-family:"Cormorant Garamond", Georgia, serif;
    min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:1rem 1.25rem 2rem; overflow-x:hidden; position:relative;
  }
  .bg, .bgvideo, .shade { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .bg { background:var(--coal); }
  .nov .bg { background:url("bg.jpg") center 55% / cover no-repeat, var(--coal); }
  .bgvideo { object-fit:cover; object-position:center 55%; opacity:0; transition:opacity .8s ease; }
  .bgvideo.on { opacity:1; }
  .shade { background:
      radial-gradient(ellipse 75% 55% at 50% 42%, rgba(18,12,9,.30), rgba(18,12,9,.80) 100%),
      linear-gradient(180deg, rgba(20,13,9,.72) 0%, rgba(20,13,9,.62) 45%, rgba(22,14,9,.86) 100%); }
  @keyframes bgin { from { opacity:0; } to { opacity:1; } }
  main { position:relative; z-index:1; width:100%; max-width:62rem; }
  h1 { font-weight:400; line-height:0; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @keyframes show { from { opacity:0; } to { opacity:1; } }
  .line { width:min(16rem,50vw); height:1px; margin:0 auto 1.6rem;
    background:linear-gradient(90deg,transparent,var(--ember),transparent);
    transform:scaleX(0); animation:draw 1.8s ease-out 14.2s forwards; }
  @keyframes draw { to { transform:scaleX(1); } }

  /* Zeile 1: Buchstaben "fangen Feuer" und kuehlen zu Creme ab */
  .claim { font-size:clamp(1.3rem,3.6vw,1.9rem); font-style:italic; letter-spacing:.03em; text-shadow:0 2px 14px rgba(0,0,0,.65); }
  .claim .w { display:inline-block; white-space:nowrap; }
  .claim .l { display:inline-block; white-space:pre; animation:catch 1.9s ease-out calc(14.6s + var(--i)*55ms) both; }
  @keyframes catch {
    0%   { opacity:0; filter:blur(9px); transform:translateY(12px); color:#ffb468; text-shadow:0 0 20px rgba(255,150,60,.95); }
    50%  { opacity:1; filter:blur(0); transform:none; color:#ffcb8c; text-shadow:0 0 16px rgba(255,140,50,.85); }
    100% { opacity:1; filter:none; transform:none; color:var(--cream); text-shadow:0 2px 14px rgba(0,0,0,.65), 0 0 12px rgba(232,161,90,.25); }
  }

  /* Zeile 2: taucht wie aus Hitzeflimmern auf, danach streift ab und zu ein warmer Lichtschimmer darueber */
  .soon { margin-top:1.1rem; font-size:clamp(1.1rem,2.7vw,1.35rem); color:#cdbfa8; text-shadow:0 2px 12px rgba(0,0,0,.7);
    animation:haze 2.6s ease-out 17.4s both; }
  @supports ((-webkit-background-clip:text) or (background-clip:text)) {
    .soon { color:transparent; text-shadow:none; -webkit-background-clip:text; background-clip:text;
      background-image:linear-gradient(100deg,#cdbfa8 38%,#ffdcab 50%,#cdbfa8 62%); background-size:260% 100%; background-position:120% 0;
      filter:drop-shadow(0 2px 8px rgba(0,0,0,.7));
      animation:haze 2.6s ease-out 17.4s both, sweep 9s ease-in-out 21s infinite; }
  }
  @keyframes haze { from { opacity:0; transform:translateY(8px) scaleY(1.12); filter:blur(7px); } to { opacity:1; transform:none; filter:blur(0); } }
  @keyframes sweep { 0%,55% { background-position:120% 0; } 100% { background-position:-20% 0; } }

  /* Zeile 3: "De la Tierra" glimmt wie Glut */
  .heritage { margin-top:2.2rem; font-size:1.1rem; color:#cdbfa8; text-shadow:0 2px 12px rgba(0,0,0,.7); animation:haze 2.4s ease-out 19.2s both; }
  .heritage em { font-size:1.28em; color:var(--ember); animation:ember 4.2s ease-in-out 22s infinite; }
  @keyframes ember {
    0%,100% { text-shadow:0 0 6px rgba(232,120,40,.35); }
    35% { text-shadow:0 0 14px rgba(255,150,60,.7), 0 0 30px rgba(232,100,30,.3); }
    60% { text-shadow:0 0 9px rgba(232,120,40,.45); }
    80% { text-shadow:0 0 18px rgba(255,160,70,.8), 0 0 36px rgba(232,100,30,.4); }
  }
  @media (prefers-reduced-motion: reduce) {
    .line { animation:none; transform:none; }
    .claim .l, .soon, .heritage, .heritage em, #fire { animation:none !important; opacity:1; filter:none; }
    .soon { background-position:50% 0; }
  }

  .stage { position:relative; width:min(94vw,56rem); aspect-ratio:1/.56; margin:0 auto -1.2rem; }
  #art, #fire { position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible; }
  #art { filter:drop-shadow(0 0 8px rgba(0,0,0,.55)); }
  .ink path { fill:none; stroke:#f1e7d6; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .gl { transform-box:fill-box; transform-origin:50% 60%; animation:stamp .55s cubic-bezier(.2,.9,.3,1.15) var(--d) both; }
  @keyframes stamp { 0% { opacity:0; transform:scale(1.7) rotate(var(--r)); } 45% { opacity:1; transform:scale(.93); } 75% { transform:scale(1.03); } 100% { opacity:1; transform:none; } }
  .gr { fill:none; stroke-linecap:round; stroke-dasharray:1.02; stroke-dashoffset:1.02; animation:grow var(--t) cubic-bezier(.35,.55,.4,1) var(--d) forwards; }
  @keyframes grow { to { stroke-dashoffset:0; } }
  .pop { transform-box:fill-box; transform-origin:0 50%; animation:pop .7s cubic-bezier(.2,.9,.3,1.35) var(--d) both; }
  .pop.c { transform-origin:50% 50%; }
  @keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
  .plants { animation:burn 2.6s ease-in 15.2s forwards; }
  @keyframes burn { to { opacity:0; filter:brightness(.35) blur(2px); transform:translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .gl { animation:none !important; opacity:1; } .plants { display:none; } }
</style>
