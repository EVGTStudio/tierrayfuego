<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tierra y Fuego · Pizza artesanal · Lago de Atitlán</title>
<meta name="description" content="Tierra y Fuego: pizza artesanal horneada al fuego, a domicilio y para llevar. Lago de Atitlán, Guatemala. De la familia de De la Tierra.">
<meta name="theme-color" content="#16110e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2316110e'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%23e8a15a' font-family='serif' font-style='italic'>T</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --coal: #16110e;
    --ash: #1f1814;
    --cream: #f1e7d6;
    --ember: #e8a15a;
    --glow: #b5532a;
    --muted: #a39683;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 70% 45% at 50% 108%, rgba(181,83,42,.38), transparent 70%),
      radial-gradient(ellipse 50% 30% at 50% 100%, rgba(232,161,90,.18), transparent 70%),
      var(--coal);
    color: var(--cream);
    font-family: "Cormorant Garamond", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.25rem;
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 62rem; }

  /* Handschrift: weicher Rand läuft von links nach rechts */
  .write {
    --dur: 4.2s;
    --delay: .6s;
    display: inline-block;
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 33%, transparent 40%);
            mask-image: linear-gradient(90deg, #000 0, #000 33%, transparent 40%);
    -webkit-mask-size: 300% 100%;
            mask-size: 300% 100%;
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-position: 100% 0;
            mask-position: 100% 0;
    animation: write var(--dur) cubic-bezier(.45,.1,.35,1) var(--delay) forwards;
  }
  @keyframes write {
    to { -webkit-mask-position: 0 0; mask-position: 0 0; }
  }

  h1 {
    font-family: "Mrs Saint Delafield", "Snell Roundhand", "Apple Chancery", cursive;
    font-weight: 400;
    font-size: clamp(4.5rem, 20vw, 14rem);
    line-height: 1.15;
    padding: .15em .35em .25em;
    color: var(--cream);
    text-shadow: 0 0 40px rgba(232,161,90,.22);
  }
  h1 .write { --dur: 4.6s; --delay: .5s; }

  .line {
    width: min(16rem, 50vw);
    height: 1px;
    margin: .4rem auto 1.6rem;
    background: linear-gradient(90deg, transparent, var(--ember), transparent);
    transform: scaleX(0);
    animation: draw 1.6s ease-out 5.2s forwards;
  }
  @keyframes draw { to { transform: scaleX(1); } }

  .claim {
    font-size: clamp(1.25rem, 3.4vw, 1.75rem);
    font-style: italic;
    letter-spacing: .02em;
    color: var(--cream);
    opacity: 0;
    animation: fade 1.8s ease 5.8s forwards;
  }
  .soon {
    margin-top: 1.1rem;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    color: var(--muted);
    opacity: 0;
    animation: fade 1.8s ease 6.6s forwards;
  }
  .heritage {
    margin-top: 3.2rem;
    font-size: 1.05rem;
    color: var(--muted);
    opacity: 0;
    animation: fade 2s ease 7.4s forwards;
  }
  .heritage span {
    font-family: "Mrs Saint Delafield", cursive;
    font-size: 2.1rem;
    color: var(--ember);
    margin-left: .15em;
    vertical-align: -.1em;
  }
  @keyframes fade { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .write { animation: none; -webkit-mask-position: 0 0; mask-position: 0 0; }
    .line { animation: none; transform: none; }
    .claim, .soon, .heritage { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<main>
  <h1><span class="write">Tierra y Fuego</span></h1>
  <div class="line" aria-hidden="true"></div>
  <p class="claim">Pizza artesanal, horneada al fuego · Lago de Atitlán</p>
  <p class="soon">Próximamente, a domicilio y para llevar.</p>
  <p class="heritage">Una nueva etapa de<span>De la Tierra</span></p>
</main>
</body>
</html>
